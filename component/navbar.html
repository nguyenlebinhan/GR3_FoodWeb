<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        :root {
            --primary: #f97316;       /* Warm Fresh Orange */
            --primary-hover: #ea580c;
            --accent-red: #ef4444;    /* Appetizing Tomato Red */
            --accent-green: #22c55e;  /* Fresh Leaf Green */
            --bg-light: #fffcf8;      /* Warm Cream Background */
            --text-dark: #1e293b;     /* Dark Slate */
            --text-muted: #64748b;    /* Slate Gray */
            --border-color: #ffedd5;  /* Soft Orange Border */
            --shadow-sm: 0 2px 8px rgba(249, 115, 22, 0.08);
            --shadow-md: 0 10px 25px -5px rgba(249, 115, 22, 0.15);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Basic CSS Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(255, 252, 248, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .navbar-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            user-select: none;
        }

        .brand-logo {
            height: 48px;          
            width: auto;           
            object-fit: contain;
            display: block;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link {
            padding: 0.6rem 1.1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            border-radius: var(--radius-full);
            transition: all 0.25s ease;
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary);
            background-color: #fff7ed;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background-color: var(--primary);
            border-radius: var(--radius-full);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="navbar-container">
            <a href="#" class="nav-brand">
            <img src="../resources/Logo/Logo.png" alt="Logo" class="brand-logo">
                <span class="brand-name">BrandName</span>
            </a>

            <nav class="nav-menu">
                <a href="#" class="nav-link active">Trang chủ</a>
                <a href="#" class="nav-link">Thực đơn</a>
                <a href="#" class="nav-link">Khuyến mãi </a>
                <a href="#" class="nav-link">Về chúng tôi</a>
                <a href="#" class="nav-link">Liên hệ</a>
            </nav>
        </div>
    </header>
</body>
</html>
